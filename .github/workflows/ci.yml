name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oplab_radar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: oplab_radar_test
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A gitleaks-action exige GITLEAKS_LICENSE em repo de organização; a imagem do
      # gitleaks não — mesmo step do radar-api.
      - name: Gitleaks Secret Scan
        uses: docker://zricethezav/gitleaks:latest
        with:
          args: detect --source . --redact -v
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npx sequelize-cli db:migrate --env development
      - run: npm test

  # Smoke test do Dockerfile em todo push/PR — sem este job, erro de build só apareceria no
  # `deploy-staging.yml` (que builda pra valer e publica no GHCR). Não empurra a imagem pra
  # registry nenhum, propósito diferente do job de deploy: aqui o build é a própria verificação.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t radar-pluggy:ci .
